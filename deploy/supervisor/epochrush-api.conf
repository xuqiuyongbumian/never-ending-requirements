[program:epochrush-api]
command=/bin/bash -c "cd /root/project/never-ending-requirements/server && exec env HOST=0.0.0.0 PORT=8787 DATABASE_PATH=/root/project/epochrush-data/game.sqlite node --experimental-strip-types src/index.ts"
directory=/root/project/never-ending-requirements/server
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/tmp/epochrush-api.log
stderr_logfile=/tmp/epochrush-api.err
user=root
stopasgroup=true
killasgroup=true
