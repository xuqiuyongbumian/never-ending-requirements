[program:epochrush]
command=/usr/local/bin/node /root/project/never-ending-requirements/deploy/gateway.mjs
directory=/root/project/never-ending-requirements/deploy
autostart=true
autorestart=true
startsecs=2
environment=STATIC_ROOT="/root/project/never-ending-requirements/dist",API_HOST="127.0.0.1",API_PORT="8787",PORT="8000"
stdout_logfile=/tmp/epochrush.log
stderr_logfile=/tmp/epochrush.err
user=root
stopasgroup=true
killasgroup=true
