<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1020" />
    <meta name="robots" content="noindex,nofollow" />
    <title>决策分析台｜需求永不眠</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/admin" aria-label="决策分析台首页">
          <span class="brand-mark" aria-hidden="true">1024</span>
          <span class="brand-copy">
            <strong>需求永不眠</strong>
            <small>决策分析台 / OPS CONSOLE</small>
          </span>
        </a>
        <div class="topbar-actions">
          <span class="status-pill" id="connection-status"><i></i><span>连接中</span></span>
          <span class="mode-pill" id="mode-pill" hidden>本地开放模式</span>
          <button class="ghost-button" id="refresh-button" type="button">刷新数据</button>
          <button class="ghost-button" id="token-button" type="button" hidden>管理令牌</button>
        </div>
      </header>

      <div class="layout">
        <aside class="sidebar" aria-label="后台导航">
          <nav class="nav-list" id="nav-list">
            <button class="nav-item is-active" data-view="overview" type="button"><span class="nav-index">01</span><span>总览</span><em>OVERVIEW</em></button>
            <button class="nav-item" data-view="sessions" type="button"><span class="nav-index">02</span><span>用户档案</span><em>PLAYERS</em></button>
            <button class="nav-item" data-view="decisions" type="button"><span class="nav-index">03</span><span>决策分析</span><em>DECISIONS</em></button>
            <button class="nav-item" data-view="leaderboard" type="button"><span class="nav-index">04</span><span>排行榜</span><em>LEADERBOARD</em></button>
            <button class="nav-item" data-view="achievements" type="button"><span class="nav-index">05</span><span>成就系统</span><em>ACHIEVEMENTS</em></button>
          </nav>
          <div class="sidebar-note">
            <span class="note-kicker">数据口径</span>
            <p>匿名 session 为最小玩家单位，对局以提交的 run 结算记录为准。行为事件由游戏端批量上报，成就由 run + 事件确定性推导。</p>
          </div>
          <div class="sidebar-foot">
            <span id="build-label">v0.1.0</span>
            <a href="/" id="game-link" target="_blank" rel="noreferrer" hidden>打开游戏 ↗</a>
          </div>
        </aside>

        <main class="main" id="main" tabindex="-1">
          <section class="view" id="view-root" aria-live="polite">
            <div class="skeleton-stack" aria-hidden="true">
              <div class="skeleton skeleton-title"></div>
              <div class="skeleton skeleton-card"></div>
              <div class="skeleton skeleton-card"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div class="auth-gate" id="auth-gate" hidden>
      <form class="auth-card" id="auth-form">
        <span class="auth-kicker">RESTRICTED CONSOLE</span>
        <h2>输入管理令牌</h2>
        <p>该后台包含匿名玩家的完整决策轨迹。服务端已启用 <code>ADMIN_TOKEN</code>，请提供 Bearer 令牌。</p>
        <label for="token-input">Admin token</label>
        <input id="token-input" name="token" type="password" autocomplete="current-password" placeholder="粘贴 ADMIN_TOKEN" required />
        <div class="auth-actions">
          <button class="primary-button" type="submit">进入分析台</button>
          <button class="ghost-button" type="button" id="auth-cancel">清空令牌</button>
        </div>
        <small id="auth-error" role="alert"></small>
      </form>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/admin/admin.js"></script>
  </body>
</html>
